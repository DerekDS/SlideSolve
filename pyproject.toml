[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidesolve"
version = "0.1.0"
description = "An A* command-line solver for sliding-tile puzzles"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Derek" }]
dependencies = []

[project.scripts]
slidesolve = "slidesolve.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
